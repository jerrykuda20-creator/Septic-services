<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="tankerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- 1. Emblem: Septic Vacuum Tanker Truck Badge -->
  <g id="tanker-emblem">
    <!-- Rounded Badge Frame -->
    <rect x="6" y="8" width="98" height="84" rx="20" fill="url(#badgeBg)" stroke="#BAE6FD" stroke-width="2.5" />

    <!-- Suction Overhead Crane / Boom Pipe -->
    <path d="M 44 26 V 16 H 18 V 65" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="65" r="2.5" fill="#0284C7" />
    <path d="M 44 26 H 58" stroke="#0369A1" stroke-width="3" stroke-linecap="round" />

    <!-- Tank Dome / Access Hatch -->
    <rect x="36" y="24" width="14" height="6" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.5" />

    <!-- Cylindrical Vacuum Tank Body -->
    <rect x="18" y="28" width="50" height="34" rx="10" fill="url(#tankerGrad)" stroke="#334155" stroke-width="2.5" />
    <!-- Tank Reinforcement Rings -->
    <line x1="32" y1="28" x2="32" y2="62" stroke="#94A3B8" stroke-width="2" />
    <line x1="46" y1="28" x2="46" y2="62" stroke="#94A3B8" stroke-width="2" />
    
    <!-- Red Brand Stripe on Tanker Body (Matching Ghanaian fleet look) -->
    <path d="M 18 42 H 68 V 48 H 18 Z" fill="url(#redAccent)" opacity="0.9" />

    <!-- Side Equipment Tray / Tooling Box -->
    <rect x="22" y="52" width="38" height="12" rx="2" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" />
    <circle cx="28" cy="58" r="1.5" fill="#64748B" />
    <circle cx="54" cy="58" r="1.5" fill="#64748B" />

    <!-- Truck Chassis Bar -->
    <rect x="18" y="62" width="76" height="5" fill="#1E293B" rx="1" />

    <!-- Modern Truck Cab -->
    <path d="M 68 36 H 86 L 94 54 V 67 H 68 V 36 Z" fill="url(#cabGrad)" stroke="#0369A1" stroke-width="2" stroke-linejoin="round" />
    <!-- Cab Windshield & Window -->
    <path d="M 72 40 H 83 L 88 52 H 72 V 40 Z" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Headlight -->
    <rect x="91" y="58" width="4" height="5" rx="1.5" fill="#FDE047" stroke="#CA8A04" stroke-width="1" />
    <!-- Front Bumper -->
    <rect x="88" y="64" width="7" height="4" rx="1" fill="#334155" />

    <!-- Heavy Duty Wheels -->
    <!-- Rear Wheel 1 -->
    <circle cx="29" cy="69" r="9" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <circle cx="29" cy="69" r="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <!-- Rear Wheel 2 -->
    <circle cx="49" cy="69" r="9" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <circle cx="49" cy="69" r="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
    <!-- Front Wheel -->
    <circle cx="82" cy="69" r="9" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <circle cx="82" cy="69" r="4" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />

    <!-- Small Clean Hygiene Water Wave Underneath -->
    <path d="M 12 80 C 25 83, 40 77, 55 80 C 70 83, 85 78, 98 81" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- 2. Typography Group -->
  <!-- "HOME LOVE" Main Brand Title -->
  <text x="118" y="44" 
        font-family="'Poppins', sans-serif" 
        font-size="30" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="#0F172A">
    HOME LOVE
  </text>

  <!-- "WASTE MANAGEMENT" Secondary Line -->
  <text x="118" y="66" 
        font-family="'Poppins', sans-serif" 
        font-size="13.5" 
        font-weight="700" 
        letter-spacing="2.2" 
        fill="#0284C7">
    WASTE MANAGEMENT
  </text>

  <!-- Divider Rule -->
  <line x1="118" y1="74" x2="495" y2="74" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Subtitle: "Septic Tank Dislodging • Accra, Ghana" -->
  <text x="118" y="88" 
        font-family="'Poppins', sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="0.8" 
        fill="#64748B">
    SEPTIC TANK DISLODGING • ACCRA, GHANA
  </text>

  <!-- Small Emerald / Sky Accents -->
  <circle cx="498" cy="40" r="3.5" fill="#10B981" />
  <circle cx="507" cy="40" r="2.5" fill="#0284C7" />
</svg>
